name: Full AI Pipeline
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Ваш запрос (текст, картинка и видео)'
        required: true
        default: 'A cat programmer typing on a laptop'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests gradio_client
          
      - name: Run pipeline
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          USER_PROMPT: ${{ github.event.inputs.prompt }}
        run: python main.py
        
      # Сохраняем ВСЕ файлы (и картинку, и видео) в артефакты
      - name: Upload AI Results
        uses: actions/upload-artifact@v4
        with:
          name: ai-results
          path: |
            image.jpg
            video.mp4