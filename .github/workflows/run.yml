name: KoteitoAI Auto Pipeline
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Ваш запрос для текста, фото и видео'
        required: true
        default: 'A futuristic cyberpunk city, neon lights'
  schedule:
    # Запуск каждый день в 03:00 ночи по UTC (примерно 06:00 по Москве)
    - cron: '0 3 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests gradio_client
        
      - name: Run pipeline
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # Если запуск по расписанию, берем дефолтный промпт из кода
          USER_PROMPT: ${{ github.event.inputs.prompt || 'A cute cat programmer, cyberpunk style' }}
        run: python main.py
        
      - name: Upload All Results
        uses: actions/upload-artifact@v4
        with:
          name: KoteitoAI-Results
          path: |
            text.txt
            image.jpg
            video.mp4
          if-no-files-found: warn
          
      # Этот шаг не дает GitHub отключить расписание через 60 дней простоя
      - name: Keepalive Workflow
        uses: gautamkrishnar/keepalive-workflow@v1
        with:
          commit_message: "Keepalive: Automated repository update"