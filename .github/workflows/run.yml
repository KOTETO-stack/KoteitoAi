name: Run Cloudflare AI
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Ваш запрос к ИИ (текст и картинка)'
        required: true
        default: 'Напиши приветствие и сгенерируй картинку с котом-программистом'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests
        
      - name: Run script
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          USER_PROMPT: ${{ github.event.inputs.prompt }}
        run: python main.py
        
      # Этот шаг сохраняет сгенерированную картинку, чтобы вы могли ее скачать
      - name: Upload generated image
        uses: actions/upload-artifact@v4
        with:
          name: generated-image
          path: generated_image.jpg
          if-no-files-found: warn