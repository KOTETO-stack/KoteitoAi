name: KoteitoAI Pipeline
on:
  workflow_dispatch:
    inputs:
      prompt:
        required: true
      chat_id:
        required: true
      secret:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests gradio_client
      - name: Run
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          BOT_SECRET: ${{ github.event.inputs.secret }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          USER_PROMPT: ${{ github.event.inputs.prompt }}
        run: python main.py