name: AI Dispatcher

on:
  workflow_dispatch:
    inputs:
      text:
        description: 'Ваш запрос'
        required: true
  repository_dispatch:
    types: [new_message]

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Get user text
        id: user_text
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "text=${{ github.event.inputs.text }}" >> $GITHUB_OUTPUT
          else
            echo "text=${{ github.event.client_payload.text }}" >> $GITHUB_OUTPUT
          fi

      - name: Analyze Intent with LLM (Free Router)
        id: intent
        run: |
          # Бесплатные текстовые модели (выбираем одну)
          MODELS=("meta-llama/Llama-3.1-8B-Instruct" "Qwen/Qwen2.5-7B-Instruct" "microsoft/Phi-3.5-mini-instruct")
          SUCCESS=0
          INTENT="image"
          PROMPT="${{ steps.user_text.outputs.text }}"

          for MODEL in "${MODELS[@]}"; do
            echo "Пробуем модель: $MODEL"
            RESPONSE=$(curl -s -X POST "https://router.huggingface.co/v1/chat/completions" \
              -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{
                \"model\": \"$MODEL\",
                \"messages\": [
                  {\"role\": \"system\", \"content\": \"Ты диспетчер. Верни ТОЛЬКО валидный JSON без markdown-оберток: {\\\"intent\\\":\\\"image|video\\\",\\\"prompt\\\":\\\"детальный промпт на английском\\\"}\"},
                  {\"role\": \"user\", \"content\": \"${{ steps.user_text.outputs.text }}\"}
                ],
                \"temperature\": 0.3,
                \"max_tokens\": 200
              }")
            
            RAW_CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
            
            if [ -n "$RAW_CONTENT" ]; then
              CONTENT=$(echo "$RAW_CONTENT" | sed 's/```json//g' | sed 's/```//g' | tr -d '\n')
              PARSED_INTENT=$(echo "$CONTENT" | jq -r '.intent // empty')
              PARSED_PROMPT=$(echo "$CONTENT" | jq -r '.prompt // empty')
              
              if [ -n "$PARSED_INTENT" ] && [ -n "$PARSED_PROMPT" ]; then
                INTENT=$PARSED_INTENT
                PROMPT=$PARSED_PROMPT
                SUCCESS=1
                echo "✅ Успешно определено: intent=$INTENT, prompt=$PROMPT"
                break
              fi
            fi
            sleep 2
          done

          if [ $SUCCESS -eq 0 ]; then
            echo "⚠️ Не удалось распарсить ответ моделей, используем базовые значения."
          fi

          echo "intent=$INTENT" >> $GITHUB_OUTPUT
          echo "prompt=$PROMPT" >> $GITHUB_OUTPUT

      - name: Generate Image (Free Flux)
        if: steps.intent.outputs.intent == 'image'
        run: |
          echo "Генерируем изображение через Flux.1-schnell..."
          HTTP_CODE=$(curl -s -w "%{http_code}" -X POST "https://router.huggingface.co/v1/images/generations" \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"model\": \"black-forest-labs/FLUX.1-schnell\", \"prompt\": \"${{ steps.intent.outputs.prompt }}\", \"response_format\": \"b64_json\"}" \
            -o hf_image_response.json)

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Ошибка генерации изображения (HTTP $HTTP_CODE):"
            cat hf_image_response.json
            exit 1
          fi

          jq -r '.data[0].b64_json' hf_image_response.json | base64 -d > result.png
          echo "✅ Изображение успешно сгенерировано."

      - name: Generate Video (Free Wan-AI I2V)
        if: steps.intent.outputs.intent == 'video'
        run: |
          echo "Генерируем видео через Wan-AI..."
          HTTP_CODE=$(curl -s -w "%{http_code}" -X POST "https://router.huggingface.co/v1/video/generations" \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"model\": \"Wan-AI/Wan2.2-I2V-A14B\", \"prompt\": \"${{ steps.intent.outputs.prompt }}\"}" \
            -o hf_video_response.json)

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Ошибка генерации видео (HTTP $HTTP_CODE):"
            cat hf_video_response.json
            exit 1
          fi

          VIDEO_URL=$(jq -r '.data[0].url // empty' hf_video_response.json)
          if [ -n "$VIDEO_URL" ]; then
            curl -s -L "$VIDEO_URL" -o result.mp4
          else
            echo "❌ Не удалось получить ссылку на видео."
            exit 1
          fi
          echo "✅ Видео успешно сгенерировано."

      - name: Send Photo to Telegram
        if: steps.intent.outputs.intent == 'image'
        run: |
          curl -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
               -F "photo=@result.png" \
               -F "caption=🖼️ ${{ steps.user_text.outputs.text }}" \
               "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendPhoto"

      - name: Send Video to Telegram
        if: steps.intent.outputs.intent == 'video'
        run: |
          curl -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
               -F "video=@result.mp4" \
               -F "caption=🎬 ${{ steps.user_text.outputs.text }}" \
               "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendVideo"